name: test

on:
  workflow_dispatch:


permissions:
    contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' 
      - name: Run script
        env:
          data: "hi"
        run: python test.py
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ./data
          git commit -m "test"
          git push
