name: validity

on:
  workflow_dispatch:


permissions:
    contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13' 
      - run: pip install -r requirements.txt

      - name: Run script
        env:
          data: "hi"
        run: |
          python ./runscripts/validity.py
