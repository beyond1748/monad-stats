<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>monad-stats</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #111;
      font-family: sans-serif;
    }

    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 280px;
      height: 80px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 500;
      text-decoration: none;
      color: #ccc;
      background: transparent;
      border: 1.5px solid #333;
      transition: border-color 0.2s, color 0.2s;
    }

    a.btn:hover {
      border-color: #aaa;
      color: #fff;
    }
  </style>
</head>
<body>

  <a class="btn" href="event.html">Event Times</a>
  <a class="btn" href="stats.html">monad-stats</a>

</body>
</html>
